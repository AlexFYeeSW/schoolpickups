<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Afterschool Pickups</title>
  <link rel="preload" as="image" href="/img/school-van.svg">
  <style>
    :root {
      --card: rgba(255, 255, 255, 0.92); --text: #1d2330; --muted: #5d6676; --line: #d9dee6;
      --accent: #2457c5; --accent-hover: #1d47a3; --accent-text: #ffffff;
      --warn-bg: #fff4e0; --warn: #8a5300; --shade: rgba(12, 24, 44, 0.55);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --card: rgba(23, 28, 37, 0.92); --text: #e7eaf0; --muted: #a3acba; --line: #333b49;
        --accent: #7aa2ff; --accent-hover: #9ab9ff; --accent-text: #0d1220;
        --warn-bg: #3a2a10; --warn: #f3c37a; --shade: rgba(5, 10, 20, 0.7);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; color: var(--text); background: #c9e6f6;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .scene {
      position: fixed; inset: 0;
      background: url("/img/school-van.svg") 62% 100% / cover no-repeat, #c9e6f6;
    }
    .scene::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, var(--shade) 0%, rgba(0, 0, 0, 0.15) 45%, rgba(0, 0, 0, 0) 70%);
    }
    main {
      position: relative; min-height: 100%;
      display: flex; align-items: center;
      padding: 32px 16px;
      max-width: 1200px; margin: 0 auto;
    }
    .card {
      width: 100%; max-width: 420px;
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 28px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--accent); letter-spacing: .2px; }
    .brand svg { flex: none; }
    h1 { font-size: 28px; line-height: 1.2; margin: 18px 0 8px; }
    .lead { margin: 0 0 22px; color: var(--muted); }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .field { display: flex; gap: 8px; }
    input[type="password"] {
      flex: 1; min-width: 0; font: inherit; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--text);
    }
    input[type="password"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    button {
      font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 10px; cursor: pointer;
      background: var(--accent); color: var(--accent-text);
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: .6; cursor: default; }
    .status { min-height: 24px; margin: 10px 0 0; font-size: 14px; color: var(--muted); }
    .status.err { color: #c0392b; }
    @media (prefers-color-scheme: dark) { .status.err { color: #ff8a7a; } }
    .notice { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 12px; }
    .foot { margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
    [hidden] { display: none !important; }

    @media (max-width: 720px) {
      .scene { background-position: 70% 100%; }
      .scene::after { background: linear-gradient(180deg, var(--shade) 0%, rgba(0, 0, 0, 0.1) 60%, rgba(0, 0, 0, 0) 100%); }
      main { align-items: flex-start; padding-top: 24px; }
      .card { margin: 0 auto; padding: 22px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="scene" role="img" aria-label="A school van parked outside a school while children with backpacks walk to it"></div>
  <main>
    <section class="card">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
          <rect width="34" height="34" rx="9" fill="currentColor"/>
          <path d="M7 12h15l5 6v5h-2.2a2.8 2.8 0 0 0-5.6 0h-4.4a2.8 2.8 0 0 0-5.6 0H7z" fill="#fff"/>
          <rect x="9" y="14" width="5" height="3.5" rx="1" fill="currentColor"/>
          <rect x="16" y="14" width="5" height="3.5" rx="1" fill="currentColor"/>
          <circle cx="12" cy="23.5" r="2" fill="#fff"/><circle cx="22" cy="23.5" r="2" fill="#fff"/>
        </svg>
        Afterschool Pickups
      </div>
      <h1>Every child, picked up on time.</h1>
      <p class="lead">Sign in to see today's pickup routes, drivers and changes.</p>

      <form id="loginForm" novalidate>
        <label for="password">Staff password</label>
        <div class="field">
          <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
          <button type="submit" id="signIn">Sign in</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
      <div id="notice"></div>

      <p class="foot">Drivers: open the personal link the office sent you. It doesn't need a password.</p>
    </section>
  </main>

<script>
  const $ = (id) => document.getElementById(id);

  // Where to go after signing in: only our own pages.
  const params = new URLSearchParams(location.search);
  const wanted = params.get("next") || "";
  const next = /^\/(schedule|manage)(\.html)?([?#].*)?$/.test(wanted) ? wanted : "/schedule";

  function setStatus(text, err = false) {
    $("status").textContent = text;
    $("status").className = err ? "status err" : "status";
  }

  async function check() {
    try {
      const s = await (await fetch("/api/session", { cache: "no-store" })).json();
      if (s.loggedIn) { location.replace(next); return; }
      if (!s.enabled) {
        $("password").disabled = true;
        $("signIn").disabled = true;
        $("notice").innerHTML = '<div class="notice">Sign-in isn\'t set up yet. In Cloudflare, add a <strong>STAFF_PASSWORD</strong> secret to the Worker (Settings → Variables and Secrets).</div>';
      }
    } catch {
      setStatus("Couldn't reach the server. Check your connection and try again.", true);
    }
  }

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = $("password").value;
    if (!password) { setStatus("Enter the staff password.", true); $("password").focus(); return; }
    $("signIn").disabled = true;
    setStatus("Signing in…");
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Couldn't sign in.");
      setStatus("Signed in. Opening the schedule…");
      location.replace(next);
    } catch (err) {
      setStatus(err.message, true);
      $("password").select();
      $("signIn").disabled = false;
    }
  });

  check();
</script>
</body>
</html>
